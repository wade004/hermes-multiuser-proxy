<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — 后台管理</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#1a1a2e;color:#e8e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    min-height:100vh;padding:24px
  }
  .container{max-width:1000px;margin:0 auto}
  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:24px;padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,.08)
  }
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(145deg,#e8a030,#e94560);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#fff
  }
  h1{font-size:20px;font-weight:600}
  .sub{font-size:12px;color:#8888aa}
  .actions{display:flex;gap:10px;align-items:center}
  .btn{
    padding:8px 16px;border-radius:8px;border:none;
    font-size:13px;font-weight:500;cursor:pointer;transition:all .15s
  }
  .btn-primary{
    background:rgba(124,185,255,.15);
    border:1px solid rgba(124,185,255,.3);color:#7cb9ff
  }
  .btn-primary:hover{background:rgba(124,185,255,.25)}
  .btn-danger{
    background:rgba(233,69,96,.15);
    border:1px solid rgba(233,69,96,.3);color:#e94560
  }
  .btn-danger:hover{background:rgba(233,69,96,.25)}
  .btn-logout{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);color:#8888aa
  }
  .btn-logout:hover{background:rgba(255,255,255,.1);color:#e8e8f0}

  /* Tabs */
  .tabs{
    display:flex;gap:0;margin-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.08)
  }
  .tab{
    padding:10px 20px;font-size:14px;font-weight:500;
    color:#8888aa;cursor:pointer;border-bottom:2px solid transparent;
    transition:all .15s;background:none;border-top:none;border-left:none;border-right:none
  }
  .tab:hover{color:#e8e8f0}
  .tab.active{color:#7cb9ff;border-bottom-color:#7cb9ff}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .card{
    background:#16213e;border:1px solid rgba(255,255,255,.08);border-radius:12px;
    padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.2)
  }
  .table-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px
  }
  .table-header h2{font-size:16px;font-weight:600}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:4px;
    font-size:11px;font-weight:600
  }
  .badge-admin{background:rgba(232,160,48,.2);color:#e8a030}
  .badge-user{background:rgba(124,185,255,.15);color:#7cb9ff}
  .badge-success{background:rgba(80,200,120,.15);color:#50c878}
  .badge-fail{background:rgba(233,69,96,.15);color:#e94560}
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;padding:10px 12px;font-size:12px;font-weight:500;
    color:#8888aa;border-bottom:1px solid rgba(255,255,255,.06)
  }
  td{
    padding:12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)
  }
  tr:hover{background:rgba(255,255,255,.02)}
  .action-btn{
    padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:#e8e8f0;font-size:12px;
    cursor:pointer;margin-right:6px;transition:all .15s
  }
  .action-btn:hover{background:rgba(255,255,255,.1)}
  .action-btn.delete{color:#e94560;border-color:rgba(233,69,96,.3)}
  .action-btn.delete:hover{background:rgba(233,69,96,.15)}
  .empty{text-align:center;padding:32px;color:#8888aa;font-size:13px}
  .ua-cell{font-size:11px;color:#8888aa;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Modal */
  .modal-overlay{
    display:none;position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.6);z-index:100;
    align-items:center;justify-content:center
  }
  .modal-overlay.active{display:flex}
  .modal{
    background:#16213e;border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:24px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.4)
  }
  .modal h3{font-size:16px;margin-bottom:16px}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;color:#8888aa;margin-bottom:6px}
  .form-group input, .form-group select{
    width:100%;padding:8px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:#e8e8f0;font-size:13px;
    outline:none;transition:border-color .15s
  }
  .form-group input:focus, .form-group select:focus{
    border-color:rgba(124,185,255,.5)
  }
  .form-group select option{background:#16213e;color:#e8e8f0}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .msg{font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px;display:none}
  .msg.success{display:block;background:rgba(80,200,120,.15);color:#50c878;border:1px solid rgba(80,200,120,.3)}
  .msg.error{display:block;background:rgba(233,69,96,.15);color:#e94560;border:1px solid rgba(233,69,96,.3)}

  /* Pagination */
  .pagination{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:16px;flex-wrap:wrap
  }
  .pagination button{
    padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:#e8e8f0;font-size:12px;
    cursor:pointer;transition:all .15s
  }
  .pagination button:hover:not(:disabled){background:rgba(124,185,255,.15);border-color:rgba(124,185,255,.3)}
  .pagination button:disabled{opacity:.4;cursor:default}
  .pagination button.active{background:rgba(124,185,255,.2);border-color:rgba(124,185,255,.4);color:#7cb9ff;font-weight:600}
  .pagination .page-info{font-size:12px;color:#8888aa;padding:0 8px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-area">
      <div class="logo">H</div>
      <div>
        <h1>Hermes 后台管理</h1>
        <p class="sub">Multi-User Proxy Admin Panel</p>
      </div>
    </div>
    <div class="actions">
      <a href="/" class="btn btn-primary">进入 WebUI</a>
      <a href="/proxy/logout" class="btn btn-logout">退出登录</a>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="users">👥 用户管理</button>
    <button class="tab" data-tab="logs">📋 登录日志</button>
    <button class="tab" data-tab="requests">💬 请求日志</button>
    <button class="tab" data-tab="stats">📊 用量统计</button>
  </div>

  <!-- Users Panel -->
  <div class="tab-panel active" id="panel-users">
    <div class="card">
      <div class="table-header">
        <h2>用户列表</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <span id="user-count" style="font-size:12px;color:#8888aa"></span>
          <button class="btn btn-primary" onclick="showAddModal()">+ 添加用户</button>
        </div>
      </div>
      <div id="msg" class="msg"></div>
      <table>
        <thead>
          <tr>
            <th>用户名</th>
            <th>Profile</th>
            <th>角色</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="user-list">
          <tr><td colspan="5" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Logs Panel -->
  <div class="tab-panel" id="panel-logs">
    <div class="card">
      <div class="table-header">
        <h2>登录日志</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <span id="log-count" style="font-size:12px;color:#8888aa"></span>
          <button class="btn btn-logout" onclick="loadLogs()">🔄 刷新</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>用户</th>
            <th>IP</th>
            <th>设备</th>
          </tr>
        </thead>
        <tbody id="log-list">
          <tr><td colspan="4" class="empty">加载中...</td></tr>
        </tbody>
      </table>
      <div id="login-pagination" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- Requests Panel -->
  <div class="tab-panel" id="panel-requests">
    <div class="card">
      <div class="table-header">
        <h2>请求日志</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <span id="req-count" style="font-size:12px;color:#8888aa"></span>
          <button class="btn btn-logout" onclick="loadRequests()">🔄 刷新</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>用户</th>
            <th>请求内容</th>
            <th>实际 Token (入/出)</th><th>缓存命中</th><th>模型</th>
          </tr>
        </thead>
        <tbody id="req-list">
          <tr><td colspan="4" class="empty">加载中...</td></tr>
        </tbody>
      </table>
      <div id="req-pagination" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- Stats Panel -->
  <div class="tab-panel" id="panel-stats">
    <div class="card">
      <div class="table-header">
        <h2>📊 用量统计</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <select id="stats-month" style="padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e8e8f0;font-size:13px;outline:none">
            <option value="">加载中...</option>
          </select>
          <button class="btn btn-logout" onclick="loadStats()">🔄 刷新</button>
        </div>
      </div>

      <!-- Ranking -->
      <div style="margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:#e8a030">🏆 月度排名</h3>
        <table>
          <thead>
            <tr>
              <th style="width:40px">排名</th>
              <th>用户</th>
              <th>请求数</th>
              <th>输入 Token</th>
              <th>输出 Token</th>
              <th>缓存命中</th>
              <th>实际总计</th>
            </tr>
          </thead>
          <tbody id="ranking-list">
            <tr><td colspan="7" class="empty">选择月份查看</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Daily Detail -->
      <div>
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:#7cb9ff">📅 每日明细</h3>
        <div style="overflow-x:auto">
          <table>
            <thead id="daily-thead">
              <tr><th>用户</th></tr>
            </thead>
            <tbody id="daily-list">
              <tr><td class="empty">选择月份查看</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">添加用户</h3>
    <div id="modal-msg" class="msg"></div>
    <form id="user-form">
      <input type="hidden" id="editing-user" value="">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="input-username" placeholder="英文用户名" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="input-password" placeholder="留空则不修改" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Profile 名称</label>
        <input type="text" id="input-profile" placeholder="将自动创建 Hermes Profile" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="input-role">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-logout" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">创建</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>确认删除</h3>
    <p style="font-size:13px;color:#aaa;margin-bottom:16px">
      确定要删除用户 <strong id="delete-username"></strong> 吗？<br>
      <span style="color:#e94560">此操作不可撤销。</span>
    </p>
    <div class="modal-actions">
      <button class="btn btn-logout" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" id="confirm-delete-btn" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  var API = '/proxy/api/users';
  var users = [];
  var deletingUser = null;

  // ── Pagination state ──
  var loginPage = 0;   var loginPerPage = 50;   var loginTotal = 0;
  var reqPage = 0;     var reqPerPage = 50;     var reqTotal = 0;

  // ── Tabs ──
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'logs') loadLogs();
      if (tab.dataset.tab === 'requests') loadRequests();
      if (tab.dataset.tab === 'stats') loadStats();
    });
  });

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(function() { el.className = 'msg'; }, 3000);
  }

  function showModalMsg(text, type) {
    var el = document.getElementById('modal-msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function parseUA(ua) {
    if (!ua) return '-';
    // Extract browser + OS
    var parts = [];
    // OS
    if (ua.indexOf('Windows') >= 0) parts.push('Windows');
    else if (ua.indexOf('Mac OS') >= 0) parts.push('macOS');
    else if (ua.indexOf('Linux') >= 0) parts.push('Linux');
    else if (ua.indexOf('Android') >= 0) parts.push('Android');
    else if (ua.indexOf('iPhone') >= 0 || ua.indexOf('iPad') >= 0) parts.push('iOS');
    // Browser
    if (ua.indexOf('Edg/') >= 0) parts.push('Edge');
    else if (ua.indexOf('Chrome/') >= 0 && ua.indexOf('Safari/') >= 0) parts.push('Chrome');
    else if (ua.indexOf('Firefox/') >= 0) parts.push('Firefox');
    else if (ua.indexOf('Safari/') >= 0 && ua.indexOf('Chrome') < 0) parts.push('Safari');
    return parts.join(' · ') || ua.substring(0, 60);
  }

  // ── Users ──
  async function loadUsers() {
    try {
      var resp = await fetch(API, {credentials: 'include'});
      if (resp.status === 403) { window.location.href = '/proxy/login'; return; }
      var data = await resp.json();
      users = data.users || [];
      renderUsers();
    } catch(e) {
      document.getElementById('user-list').innerHTML =
        '<tr><td colspan="5" class="empty">加载失败</td></tr>';
    }
  }

  function renderUsers() {
    var tbody = document.getElementById('user-list');
    var count = document.getElementById('user-count');
    count.textContent = '共 ' + users.length + ' 个用户';
    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无用户</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(function(u) {
      var roleClass = u.role === 'admin' ? 'badge-admin' : 'badge-user';
      var roleText = u.role === 'admin' ? '管理员' : '用户';
      return '<tr>' +
        '<td><strong>' + escHtml(u.username) + '</strong></td>' +
        '<td><code style="font-size:12px;color:#7cb9ff">' + escHtml(u.profile) + '</code></td>' +
        '<td><span class="badge ' + roleClass + '">' + roleText + '</span></td>' +
        '<td style="font-size:12px;color:#8888aa">' + escHtml(u.created_at || '-') + '</td>' +
        '<td>' +
          '<button class="action-btn" onclick="editUser(\'' + escHtml(u.username) + '\')">编辑</button>' +
          '<button class="action-btn delete" onclick="deleteUser(\'' + escHtml(u.username) + '\')">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  window.showAddModal = function() {
    document.getElementById('modal-title').textContent = '添加用户';
    document.getElementById('editing-user').value = '';
    document.getElementById('input-username').value = '';
    document.getElementById('input-username').disabled = false;
    document.getElementById('input-password').value = '';
    document.getElementById('input-password').placeholder = '必填';
    document.getElementById('input-password').required = true;
    document.getElementById('input-profile').value = '';
    document.getElementById('input-role').value = 'user';
    document.getElementById('submit-btn').textContent = '创建';
    document.getElementById('modal-msg').className = 'msg';
    document.getElementById('modal').classList.add('active');
  };

  window.editUser = function(username) {
    var u = users.find(function(x) { return x.username === username; });
    if (!u) return;
    document.getElementById('modal-title').textContent = '编辑用户';
    document.getElementById('editing-user').value = username;
    document.getElementById('input-username').value = username;
    document.getElementById('input-username').disabled = true;
    document.getElementById('input-password').value = '';
    document.getElementById('input-password').placeholder = '留空则不修改';
    document.getElementById('input-password').required = false;
    document.getElementById('input-profile').value = u.profile;
    document.getElementById('input-role').value = u.role;
    document.getElementById('submit-btn').textContent = '保存';
    document.getElementById('modal-msg').className = 'msg';
    document.getElementById('modal').classList.add('active');
  };

  window.closeModal = function() {
    document.getElementById('modal').classList.remove('active');
  };

  window.deleteUser = function(username) {
    deletingUser = username;
    document.getElementById('delete-username').textContent = username;
    document.getElementById('delete-modal').classList.add('active');
  };

  window.closeDeleteModal = function() {
    document.getElementById('delete-modal').classList.remove('active');
    deletingUser = null;
  };

  window.confirmDelete = async function() {
    if (!deletingUser) return;
    var btn = document.getElementById('confirm-delete-btn');
    btn.disabled = true; btn.textContent = '删除中...';
    try {
      var resp = await fetch(API + '/' + deletingUser, {method:'DELETE',credentials:'include'});
      var data = await resp.json();
      if (data.ok) {
        showMsg('用户 ' + deletingUser + ' 已删除', 'success');
        closeDeleteModal(); loadUsers();
      } else { showMsg(data.error || '删除失败', 'error'); }
    } catch(e) { showMsg('请求失败', 'error'); }
    finally { btn.disabled = false; btn.textContent = '删除'; }
  };

  document.getElementById('user-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var editing = document.getElementById('editing-user').value;
    var username = document.getElementById('input-username').value.trim();
    var password = document.getElementById('input-password').value;
    var profile = document.getElementById('input-profile').value.trim();
    var role = document.getElementById('input-role').value;
    if (!username || !profile) { showModalMsg('用户名和 Profile 不能为空', 'error'); return; }
    if (!editing && !password) { showModalMsg('新用户必须设置密码', 'error'); return; }
    var btn = document.getElementById('submit-btn'); btn.disabled = true;
    try {
      var resp, data;
      if (editing) {
        var body = {profile: profile, role: role};
        if (password) body.password = password;
        resp = await fetch(API + '/' + editing, {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body), credentials:'include'
        });
      } else {
        resp = await fetch(API, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username:username,password:password,profile:profile,role:role}),
          credentials:'include'
        });
      }
      data = await resp.json();
      if (data.ok) { showMsg(editing?'用户已更新':'用户已创建','success'); closeModal(); loadUsers(); }
      else { showModalMsg(data.error || '操作失败', 'error'); }
    } catch(e) { showModalMsg('请求失败', 'error'); }
    finally { btn.disabled = false; }
  });

  // ── Pagination helper ──
  function renderPagination(containerId, page, perPage, total, loadFn) {
    var el = document.getElementById(containerId);
    var totalPages = Math.ceil(total / perPage);
    if (totalPages <= 1) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    var html = '';
    html += '<button ' + (page === 0 ? 'disabled' : '') + ' data-page="' + (page - 1) + '">← 上一页</button>';
    var start = Math.max(0, page - 2);
    var end = Math.min(totalPages - 1, page + 2);
    if (start > 0) { html += '<button data-page="0">1</button>'; if (start > 1) html += '<span class="page-info">…</span>'; }
    for (var i = start; i <= end; i++) { html += '<button class="' + (i === page ? 'active' : '') + '" data-page="' + i + '">' + (i + 1) + '</button>'; }
    if (end < totalPages - 1) { if (end < totalPages - 2) html += '<span class="page-info">…</span>'; html += '<button data-page="' + (totalPages - 1) + '">' + totalPages + '</button>'; }
    html += '<button ' + (page >= totalPages - 1 ? 'disabled' : '') + ' data-page="' + (page + 1) + '">下一页 →</button>';
    html += '<span class="page-info">' + (page + 1) + '/' + totalPages + ' 页，共 ' + total + ' 条</span>';
    el.innerHTML = html;
    el.querySelectorAll('button[data-page]').forEach(function(btn) {
      if (btn.disabled) return;
      btn.addEventListener('click', function() { loadFn(parseInt(btn.getAttribute('data-page'))); });
    });
  }

  // ── Login Logs ──
  window.loadLogs = async function(page) {
    if (typeof page !== 'number') page = loginPage;
    loginPage = page;
    var tbody = document.getElementById('log-list');
    tbody.innerHTML = '<tr><td colspan="4" class="empty">加载中...</td></tr>';
    try {
      var resp = await fetch('/proxy/api/login-log?limit=' + loginPerPage + '&offset=' + (page * loginPerPage), {credentials:'include'});
      if (resp.status === 403) { window.location.href = '/proxy/login'; return; }
      var data = await resp.json();
      loginTotal = data.total || 0;
      var log = (data.log || []).reverse(); // newest first
      document.getElementById('log-count').textContent = '共 ' + loginTotal + ' 条记录（保留30天）';
      if (log.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无登录记录</td></tr>';
        renderPagination('login-pagination', page, loginPerPage, loginTotal, loadLogs);
        return;
      }
      tbody.innerHTML = log.map(function(e) {
        return '<tr>' +
          '<td style="font-size:12px;color:#8888aa;white-space:nowrap">' + escHtml(e.time) + '</td>' +
          '<td><strong>' + escHtml(e.username) + '</strong></td>' +
          '<td style="font-size:12px;color:#7cb9ff">' + escHtml(e.ip) + '</td>' +
          '<td class="ua-cell" title="' + escHtml(e.user_agent) + '">' + escHtml(parseUA(e.user_agent)) + '</td>' +
        '</tr>';
      }).join('');
      renderPagination('login-pagination', page, loginPerPage, loginTotal, loadLogs);
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>';
    }
  };

  // ── Request Logs ──
  window.loadRequests = async function(page) {
    if (typeof page !== 'number') page = reqPage;
    reqPage = page;
    var tbody = document.getElementById('req-list');
    tbody.innerHTML = '<tr><td colspan="4" class="empty">加载中...</td></tr>';
    try {
      var resp = await fetch('/proxy/api/request-log?limit=' + reqPerPage + '&offset=' + (page * reqPerPage), {credentials:'include'});
      if (resp.status === 403) { window.location.href = '/proxy/login'; return; }
      var data = await resp.json();
      reqTotal = data.total || 0;
      var log = (data.log || []).reverse(); // newest first
      document.getElementById('req-count').textContent = '共 ' + reqTotal + ' 条记录（保留14天）';
      if (log.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无请求记录</td></tr>';
        renderPagination('req-pagination', page, reqPerPage, reqTotal, loadRequests);
        return;
      }
      tbody.innerHTML = log.map(function(e) {
        var inp = e.input_tokens || 0;
        var out = e.output_tokens || 0;
        var cacheR = e.cache_read_tokens || 0;
        var model = e.model || '';
        var tokenText = (inp > 0 || out > 0)
          ? '<span style="color:#50c878">' + inp.toLocaleString() + '</span> / <span style="color:#e8a030">' + out.toLocaleString() + '</span>'
          : '<span style="color:#8888aa">-</span>';
        var cacheText = cacheR > 0
          ? '<span style="color:#4DD0E1" title="缓存读取">' + formatTokens(cacheR) + '</span>'
          : '<span style="color:#8888aa">-</span>';
        return '<tr>' +
          '<td style="font-size:12px;color:#8888aa;white-space:nowrap">' + escHtml(e.time) + '</td>' +
          '<td><strong>' + escHtml(e.username) + '</strong></td>' +
          '<td style="font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escHtml(e.message) + '">' + escHtml(e.message) + '</td>' +
          '<td style="font-size:12px;white-space:nowrap">' + tokenText + '</td>' +
          '<td style="font-size:12px;white-space:nowrap">' + cacheText + '</td>' +
          '<td style="font-size:11px;color:#8888aa;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escHtml(model) + '">' + escHtml(model) + '</td>' +
        '</tr>';
      }).join('');
      renderPagination('req-pagination', page, reqPerPage, reqTotal, loadRequests);
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">加载失败</td></tr>';
    }
  };

  // ── Statistics ──
  var _statsData = null;

  function formatTokens(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  window.loadStats = async function() {
    var monthSelect = document.getElementById('stats-month');
    var selectedMonth = monthSelect.value;
    try {
      var url = '/proxy/api/request-stats';
      if (selectedMonth) url += '?month=' + encodeURIComponent(selectedMonth);
      var resp = await fetch(url, {credentials: 'include'});
      if (resp.status === 403) { window.location.href = '/proxy/login'; return; }
      var data = await resp.json();
      _statsData = data.stats;

      // Populate month selector
      var months = data.available_months || [];
      var currentVal = monthSelect.value;
      monthSelect.innerHTML = '';
      if (months.length === 0) {
        monthSelect.innerHTML = '<option value="">暂无数据</option>';
      } else {
        months.forEach(function(m) {
          var opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          monthSelect.appendChild(opt);
        });
        if (currentVal && months.indexOf(currentVal) >= 0) {
          monthSelect.value = currentVal;
        }
      }

      renderRanking(_statsData.ranking || []);
      renderDailyDetail(_statsData);
    } catch(e) {
      document.getElementById('ranking-list').innerHTML =
        '<tr><td colspan="6" class="empty">加载失败</td></tr>';
    }
  };

  function renderRanking(ranking) {
    var tbody = document.getElementById('ranking-list');
    if (ranking.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
      return;
    }
    var medals = ['🥇', '🥈', '🥉'];
    tbody.innerHTML = ranking.map(function(r, i) {
      var medal = i < 3 ? medals[i] : String(i + 1);
      var realTotal = r.total_real_tokens || (r.total_input + r.total_output);
      var cacheR = r.total_cache_read || 0;
      return '<tr>' +
        '<td style="text-align:center;font-size:16px">' + medal + '</td>' +
        '<td><strong>' + escHtml(r.username) + '</strong></td>' +
        '<td>' + r.total_requests + '</td>' +
        '<td style="color:#50c878">' + formatTokens(r.total_input) + '</td>' +
        '<td style="color:#e8a030">' + formatTokens(r.total_output) + '</td>' +
        '<td style="color:#4DD0E1">' + (cacheR > 0 ? formatTokens(cacheR) : '-') + '</td>' +
        '<td><strong>' + formatTokens(realTotal) + '</strong></td>' +
      '</tr>';
    }).join('');
  }

  function renderDailyDetail(stats) {
    var thead = document.getElementById('daily-thead');
    var tbody = document.getElementById('daily-list');
    var days = stats.days || [];
    var usersData = stats.users || {};
    var usernames = Object.keys(usersData);

    if (days.length === 0 || usernames.length === 0) {
      thead.innerHTML = '<tr><th>用户</th></tr>';
      tbody.innerHTML = '<tr><td class="empty">暂无数据</td></tr>';
      return;
    }

    // Build header: User | Day1 | Day2 | ... | Total
    var headerHtml = '<tr><th style="white-space:nowrap">用户</th>';
    days.forEach(function(d) {
      headerHtml += '<th style="text-align:center;white-space:nowrap">' + d + '日</th>';
    });
    headerHtml += '<th style="text-align:center">总计</th></tr>';
    thead.innerHTML = headerHtml;

    // Build rows sorted by total tokens desc
    var sortedUsers = usernames.slice().sort(function(a, b) {
      var ta = (usersData[a].total_input || 0) + (usersData[a].total_output || 0);
      var tb = (usersData[b].total_input || 0) + (usersData[b].total_output || 0);
      return tb - ta;
    });

    tbody.innerHTML = sortedUsers.map(function(username) {
      var ud = usersData[username];
      var totalAll = (ud.total_input || 0) + (ud.total_output || 0);
      var totalCache = ud.total_cache_read || 0;
      var row = '<tr><td><strong>' + escHtml(username) + '</strong></td>';
      days.forEach(function(d) {
        var dd = ud.daily[d];
        if (dd) {
          var models = Object.keys(dd.models || {});
          var modelStr = models.length > 0 ? models.join(', ') : '';
          var cacheR = dd.cache_read || 0;
          var tip = '入: ' + dd.input + ' 出: ' + dd.output;
          if (cacheR > 0) tip += ' 缓存: ' + cacheR;
          if (modelStr) tip += ' 模型: ' + modelStr;
          row += '<td style="text-align:center;font-size:11px;white-space:nowrap" title="' +
            escHtml(tip) + '">' +
            '<span style="color:#50c878">' + formatTokens(dd.input) + '</span>' +
            '<span style="color:#8888aa"> / </span>' +
            '<span style="color:#e8a030">' + formatTokens(dd.output) + '</span>';
          if (cacheR > 0) {
            row += '<br><span style="color:#4DD0E1;font-size:10px">缓存 ' + formatTokens(cacheR) + '</span>';
          } else {
            row += '<br><span style="color:#8888aa;font-size:10px">' + dd.requests + '次</span>';
          }
          row += '</td>';
        } else {
          row += '<td style="text-align:center;color:#333">-</td>';
        }
      });
      var totalTitle = '实际: ' + totalAll;
      if (totalCache > 0) totalTitle += ' 缓存: ' + totalCache;
      row += '<td style="text-align:center" title="' + totalTitle + '"><strong>' + formatTokens(totalAll) + '</strong>';
      if (totalCache > 0) {
        row += '<br><span style="color:#4DD0E1;font-size:10px">缓存 ' + formatTokens(totalCache) + '</span>';
      }
      row += '</td>';
      row += '</tr>';
      return row;
    }).join('');
  }

  // Month selector change
  document.getElementById('stats-month').addEventListener('change', function() {
    loadStats();
  });

  // Modal close on overlay click
  document.getElementById('modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
  document.getElementById('delete-modal').addEventListener('click', function(e) { if(e.target===this) closeDeleteModal(); });

  loadUsers();
})();
</script>
</body>
</html>
